[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pde-discovery-lab"
version = "0.1.0"
description = "Evidence-driven PDE discovery and independent validation prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3", "scipy>=1.13,<2", "scikit-learn>=1.5,<2", "fastapi>=0.110,<1", "uvicorn>=0.30,<1", "matplotlib>=3.8,<4"]

[tool.setuptools.packages.find]
include = ["pde_discovery*"]

[tool.setuptools.package-data]
pde_discovery = ["static/*.html", "data/real_heat/*", "data/mendeley_heat/*", "data/mendeley_heat/*/*", "data/additive_heat/*", "data/additive_heat/*/*", "data/external_lab/*.json", "data/generic_pde/*.json"]
